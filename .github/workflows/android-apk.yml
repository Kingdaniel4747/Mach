name: MACH APK veröffentlichen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mach-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Signierte APK erstellen und veröffentlichen
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Code laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java einrichten
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Neue Version festlegen
        shell: bash
        run: |
          version_code=$((100000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          version_name="1.15.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "MACH_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "MACH_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "MACH_VERSION_TAG=v$version_name" >> "$GITHUB_ENV"

      - name: Signierte APK bauen
        working-directory: wachwerk-android
        shell: bash
        env:
          WACHWERK_KEYSTORE_BASE64: ${{ secrets.WACHWERK_KEYSTORE_BASE64 }}
          WACHWERK_STORE_PASSWORD: ${{ secrets.WACHWERK_STORE_PASSWORD }}
          WACHWERK_KEY_ALIAS: ${{ secrets.WACHWERK_KEY_ALIAS }}
          WACHWERK_KEY_PASSWORD: ${{ secrets.WACHWERK_KEY_PASSWORD }}
        run: |
          for value in WACHWERK_KEYSTORE_BASE64 WACHWERK_STORE_PASSWORD WACHWERK_KEY_ALIAS WACHWERK_KEY_PASSWORD; do
            test -n "${!value}" || { echo "GitHub-Secret $value fehlt"; exit 1; }
          done
          umask 077
          export WACHWERK_KEYSTORE="$RUNNER_TEMP/mach-release.jks"
          printf '%s' "$WACHWERK_KEYSTORE_BASE64" | base64 --decode > "$WACHWERK_KEYSTORE"
          bash gradlew --no-daemon assembleRelease

      - name: GitHub-Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          cp wachwerk-android/app/build/outputs/apk/release/app-release.apk "release/MACH-$MACH_VERSION_NAME.apk"
          gh release create "$MACH_VERSION_TAG" "release/MACH-$MACH_VERSION_NAME.apk" --target "$GITHUB_SHA" --title "MACH $MACH_VERSION_NAME" --notes "Signierte Android-App MACH $MACH_VERSION_NAME"
